<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - fletero.app</title>
    <style>
        /* =========================================
           DISEÑO PREMIUM - LOGIN (UI/UX)
           ========================================= */
        :root {
            --primary: #0f172a;    /* Azul Noche (Elegancia/Corporativo) */
            --accent: #f97316;     /* Naranja (Acción/Logística) */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: var(--bg-gradient); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }

        /* Tarjeta principal flotante */
        .login-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* Detalle decorativo superior */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: var(--accent);
        }

        /* Cabecera del Login */
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; color: var(--primary); }
        .header h1 span { color: var(--accent); }
        .header p { color: var(--text-muted); font-size: 15px; margin-top: 5px; }

        /* Estilos de los Formularios */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text-dark); text-transform: uppercase; letter-spacing: 0.5px; }
        
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-dark);
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1);
        }

        /* Botón de Acción Principal */
        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(249, 115, 22, 0.3);
            margin-top: 10px;
        }
        .btn-submit:hover { background: #ea580c; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.4); }
        .btn-submit:active { transform: translateY(0); }

        /* Enlaces para alternar entre Login y Registro */
        .toggle-link {
            text-align: center;
            display: block;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
            transition: color 0.2s;
        }
        .toggle-link span { color: var(--accent); font-weight: 700; }
        .toggle-link:hover span { text-decoration: underline; color: #c2410c; }

        /* Ocultar formulario de registro por defecto */
        #form-registro { display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        
        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <div id="form-login">
            <div class="header">
                <h1>fletero<span>.app</span> 🚚</h1>
                <p>Ingresa a tu panel de control</p>
            </div>
            
            <form onsubmit="iniciarSesion(event)">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="login_email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login_password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Entrar a mi cuenta</button>
            </form>
            <a class="toggle-link" onclick="toggleForms()">¿No tienes cuenta? <span>Regístrate aquí</span></a>
        </div>

        <!-- FORMULARIO DE REGISTRO -->
        <div id="form-registro">
            <div class="header">
                <h1>Únete a fletero<span>.app</span></h1>
                <p>Crea tu cuenta corporativa</p>
            </div>
            
            <form onsubmit="registrarUsuario(event)">
                <div class="form-group">
                    <label>Nombre Completo / Empresa</label>
                    <input type="text" id="reg_nombre" placeholder="Ej: Juan Pérez o Empresa C.A." required>
                </div>
                <div class="form-group">
                    <label>Documento (RIF / C.I.)</label>
                    <input type="text" id="reg_doc" placeholder="Ej: J-12345678-9" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="reg_email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Crear Contraseña</label>
                    <input type="password" id="reg_password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Crear mi cuenta</button>
            </form>
            <a class="toggle-link" onclick="toggleForms()">¿Ya tienes cuenta? <span>Inicia sesión</span></a>
        </div>

    </div>

    <!-- =========================================
         LÓGICA DEL SISTEMA
         ========================================= -->
    <script>
        // Animación suave para alternar entre formularios
        function toggleForms() {
            const login = document.getElementById('form-login');
            const registro = document.getElementById('form-registro');
            
            if (login.style.display === 'none') {
                login.style.display = 'block';
                registro.style.display = 'none';
            } else {
                login.style.display = 'none';
                registro.style.display = 'block';
            }
        }

        // Lógica de Inicio de Sesión
        async function iniciarSesion(e) {
            e.preventDefault(); // Evita que la página recargue al darle al botón
            const email = document.getElementById('login_email').value;
            const password = document.getElementById('login_password').value;

            const res = await fetch('http://localhost:3000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();
            
            if (data.error) {
                alert(data.error); // Contraseña incorrecta
            } else {
                // Éxito: Guardamos los datos del usuario en la memoria del navegador
                localStorage.setItem('usuario', JSON.stringify(data));
                
                // Si es el Master, lo mandamos al panel, sino a la calculadora
                if (data.rol === 'admin') {
                    window.location.href = '/admin.html';
                } else {
                    window.location.href = '/index.html';
                }
            }
        }

        // Lógica de Registro
        async function registrarUsuario(e) {
            e.preventDefault();
            const nombre = document.getElementById('reg_nombre').value;
            const doc = document.getElementById('reg_doc').value;
            const email = document.getElementById('reg_email').value;
            const password = document.getElementById('reg_password').value;

            const res = await fetch('http://localhost:3000/api/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre_completo: nombre, documento_identidad: doc, email, password })
            });

            const data = await res.json();
            
            if (data.error) {
                alert(data.error); // Correo ya registrado, etc.
            } else {
                alert("¡Registro exitoso! Ya puedes iniciar sesión.");
                toggleForms(); // Lo devolvemos a la pantalla de login automáticamente
                
                // Le rellenamos el correo para que no lo escriba de nuevo
                document.getElementById('login_email').value = email;
                document.getElementById('login_password').focus();
            }
        }
    </script>
</body>
</html>
